sensitivity_name: landsat_sr_qa_aerosol
version: 1
primary_analysis_commit: 624c682
source_dataset: LANDSAT/LC08/C02/T1_L2 and LANDSAT/LC09/C02/T1_L2
source_data_status: frozen_local_primary_assets_do_not_include_SR_QA_AEROSOL; re-export_from_same_C2_L2_scenes_required
output_root: Data/Additional Sensitivity Analysis/Landsat Aerosol QA
dry_run: true
full_run: false
aerosol_mode: exclude_high_aerosol
missing_qa_policy: reject
official_documentation:
  publisher: U.S. Geological Survey
  title: Landsat Collection 2 Quality Assessment Bands
  url: https://www.usgs.gov/landsat-missions/landsat-collection-2-quality-assessment-bands
  product: Landsat 8/9 Collection 2 Level-2 Surface Reflectance (LaSRC)
  accessed: "2026-08-30"
bit_definitions:
  fill: {offset: 0, accepted: [0]}
  valid_aerosol_retrieval: {offset: 1, accepted: [1]}
  interpolated_aerosol: {offset: 5, accepted_for_strict_modes: [0]}
  aerosol_level: {offset: 6, width: 2, values: {0: climatology, 1: low, 2: medium, 3: high}}
modes:
  primary_no_aerosol_filter:
    extra_filter: none
  exclude_high_aerosol:
    accepted_aerosol_levels: [climatology, low, medium]
  valid_retrieval_no_high:
    require_valid_retrieval: true
    accepted_interpolated_flag: [0]
    accepted_aerosol_levels: [climatology, low, medium]
  strict_aerosol:
    require_valid_retrieval: true
    accepted_interpolated_flag: [0]
    accepted_aerosol_levels: [climatology, low]
required_same_scene_bands: [SR_B4, SR_B5, QA_PIXEL, QA_RADSAT, SR_QA_AEROSOL]
future_outputs:
  aerosol_retention_summary: final/aerosol_retention_summary.csv
  paired_ndvi_fcover_by_mode: final/paired_ndvi_fcover_by_mode.parquet
  multi_aoi_metrics_by_mode: final/multi_aoi_metrics_by_mode.csv
  rolling_origin_metrics_by_mode: final/rolling_origin_metrics_by_mode.csv
  block_contrasts_by_mode: final/block_contrasts_by_mode.csv
