# Sole runtime contract for scripts 20 and 21.  Repeated methodology sections
# are deliberate: runners assert byte-for-value consistency with the baseline.
phase: scientific_execution
scientific_execution_enabled: true
execution_acknowledged: true
authorization_source: explicit_user_authorization
authorization_scope: frozen_scientific_execution_only
parity_validation_enabled: false
parity_validation_acknowledged: false
readiness_validation_enabled: true
readiness_validation_acknowledged: true
execution_contract_version: scientific_execution_v1
frozen_design_hash: b21c8cc7f3d4d35e1db4dfa1c8245ff10ba657c0a0a001992b552808766cc49b
active_experiments: [multi_aoi, rolling_origin]
removed_experiments: [fcover_quality_sensitivity]
frozen_design_references:
  active_design: report/publication/new_experiments/07_design_and_narrative_revision/03_FINAL_ACTIVE_EXPERIMENT_DESIGN.md
  final_aoi_registry: report/publication/new_experiments/01_multi_aoi/final_four_aoi_registry.geojson
  rolling_origin_design: report/publication/new_experiments/02_rolling_origin/experiment_design.md
  multi_aoi_design: report/publication/new_experiments/01_multi_aoi/experiment_design.md
final_aoi_ids: [AOI-00, AOI-01, AOI-02, AOI-03]
years: [2021, 2022, 2023, 2024, 2025]
nominal_dates: ["07-20", "07-31", "08-10"]
temporal_window_days: {before: 15, after: 15, inclusive: true}
modis_temporal_support_rule: 8-day_best_observation_with_support_interval_overlapping_nominal_window
multi_aoi_historical_windows:
  - {id: W2022, train_years: [2022]}
  - {id: W2023, train_years: [2023]}
  - {id: W2024, train_years: [2024]}
  - {id: W2022_2023, train_years: [2022, 2023]}
  - {id: W2023_2024, train_years: [2023, 2024]}
  - {id: W2022_2024, train_years: [2022, 2023, 2024]}

methodology:
  data_execution_backend: gee_cloud
  source_of_truth: report/publication/english/FVC_publication_en.pdf
  years: [2021, 2022, 2023, 2024, 2025]
  nominal_dates: ["07-20", "07-31", "08-10"]
  temporal_window_days: {before: 15, after: 15, inclusive: true}
  processing_order: [reflectance_scaling, native_qa, source_pixel_ndvi, average_to_native_fcover_grid, temporal_nanmedian_on_fcover_grid]
  minimum_finite_contributions: 2
  target_support:
    product: Copernicus FCOVER 300m V2 RT6
    grid: native_product_grid
    crs: EPSG:4326
    nominal_resolution_degrees: [0.002976190476204, 0.002976190476190]
    resample_fcover: false
    extra_coverage_threshold: null
  spatial_blocks: {size_m: 5000, crs: EPSG:32647, origin_xy_m: [525000, 4195000]}
  historical_partition: {reserve_fraction: 0.20, seed: 42, ranking: sha256, complete_blocks_only: true, groupkfold_domain: development_only, loyo_domain: development_only, final_refit_domain: development_plus_reserve}
  model: {family: OLS, intercept: true, predictor: NDVI, label: FCOVER_product_reference, prediction_clip: [0.0, 1.0]}
  metrics: [RMSE, MAE, Bias, R2, Pearson_r]
  terminology: {fcover: operational_product_reference, valid_domain_mask: derived_from_source_nodata_and_raster_validity, reserve: pre_refit_historical_spatial_diagnostic, target_2024: retrospective_rolling_origin_evaluation, target_2025: primary_independent_future_year_evaluation}
  active_experiments: [multi_aoi, rolling_origin]

sensors:
  sentinel2:
    product: COPERNICUS/S2_SR_HARMONIZED
    cloud_probability_product: COPERNICUS/S2_CLOUD_PROBABILITY
    red_band: B4
    nir_band: B8
    scale: 0.0001
    offset: 0.0
    valid_dn: [1, 10000]
    excluded_scl: [0, 1, 2, 3, 6, 8, 9, 10, 11]
    cloud_probability_exclude_gte: 30
    cloud_probability_missing: fail_observation
  landsat:
    product: [LANDSAT/LC08/C02/T1_L2, LANDSAT/LC09/C02/T1_L2]
    red_band: SR_B4
    nir_band: SR_B5
    scale: 0.0000275
    offset: -0.2
    valid_dn: [7273, 43636]
    qa_pixel_invalid_bits: [0, 1, 2, 3, 4, 5, 7]
    qa_radsat_required: 0
    platform_availability: {2021: [LANDSAT_8], 2022: [LANDSAT_8, LANDSAT_9], 2023: [LANDSAT_8, LANDSAT_9], 2024: [LANDSAT_8, LANDSAT_9], 2025: [LANDSAT_8, LANDSAT_9]}
  modis:
    product: MODIS/061/MOD09Q1
    red_band: sur_refl_b01
    nir_band: sur_refl_b02
    temporal_support: 8-day best observation
    scale: 0.0001
    offset: 0.0
    valid_dn: [-100, 16000]
    nodata_dn: -28672
    state_qa:
      cloud_state: {offset: 0, width: 2, keep: [0]}
      cloud_shadow: {offset: 2, width: 1, keep: [0]}
      land_water: {offset: 3, width: 3, keep: [1]}
      aerosol_quantity: {offset: 6, width: 2, keep: [0, 1, 2]}
      cirrus: {offset: 8, width: 2, keep: [0]}
      internal_cloud: {offset: 10, width: 1, keep: [0]}
      internal_fire: {offset: 11, width: 1, keep: [0]}
      mod35_snow_ice: {offset: 12, width: 1, keep: [0]}
      adjacent_cloud: {offset: 13, width: 1, keep: [0]}
      internal_snow: {offset: 15, width: 1, keep: [0]}
    qc_250m:
      modland_quality: {offset: 0, width: 2, keep: [0, 1]}
      band_1_quality: {offset: 4, width: 4, keep: [0]}
      band_2_quality: {offset: 8, width: 4, keep: [0]}
      atmospheric_correction: {offset: 12, width: 1, keep: [1]}

fcover_reference:
  product: Copernicus FCOVER 300m V2 RT6
  product_version_observed: V2.0.1
  encoding: {dtype: UInt16, scale: 0.004, offset: 0.0, nodata: 65535}
  product_provided_quality_fields: [QFLAG, NOBS]
  derived_validity_domain: {api_name: valid_domain_mask, source: source_nodata_and_raster_validity_semantics, interpretation: identifies_valid_fcover_support_cells_only, not_a_source_band: true, not_an_independent_quality_flag: true}
  baseline_predicates: [FCOVER_DN != nodata, QFLAG != nodata, NOBS != nodata, valid_domain_mask == 1, QFLAG < 255, NOBS > 0, 0 <= FCOVER_DN * 0.004 <= 1]

rolling_origin:
  primary:
    - {id: R2024-H1, target_year: 2024, history_years: [2023], history_length: 1, target_role: retrospective}
    - {id: R2024-H2, target_year: 2024, history_years: [2022, 2023], history_length: 2, target_role: retrospective}
    - {id: R2024-H3, target_year: 2024, history_years: [2021, 2022, 2023], history_length: 3, target_role: retrospective}
    - {id: R2025-H1, target_year: 2025, history_years: [2024], history_length: 1, target_role: primary_independent_future_year}
    - {id: R2025-H2, target_year: 2025, history_years: [2023, 2024], history_length: 2, target_role: primary_independent_future_year}
    - {id: R2025-H3, target_year: 2025, history_years: [2022, 2023, 2024], history_length: 3, target_role: primary_independent_future_year}
  contrasts: [[1, 2], [1, 3], [2, 3]]
  paired_unit: 5km_block_within_aoi
  test: paired_two_sided_t
  alpha: 0.05
  multiple_testing: {method: Holm, family: sensor_aoi_target_year, size: 3}
multi_aoi_statistics: {status: NOT_SPECIFIED_IN_FROZEN_ACTIVE_DESIGN, execute: false}

gee_data_center:
  asset_root: projects/qinghai-internship-fvc-models/assets/fvc_report_data
  pair_collection: paired_observations
  fcover_collection: fcover_native
  paired_cube_band_schema: 36
  manifest: report/publication/new_experiments/data/manifests/gee_cloud_asset_manifest.json
  preparation_manifest: report/publication/new_experiments/data/manifests/gee_cloud_preparation_manifest.json
  source_scene_manifest_root: report/publication/new_experiments/08_scientific_execution/00_execution_manifest/source_scenes
  source_manifest_required_fields: [AOI_ID, sensor, platform, year, nominal_date, window_start, window_end, GEE_collection_ID, system:id, system:index, acquisition_datetime, processing_version, included, exclusion_reason, source_manifest_hash]
provenance: {processing_hash_required: true, source_manifest_hash_required: true, aoi_geometry_hash_required: true, block_manifest_hash_required: true, code_version_required: true, stale_asset_reuse_forbidden: true}
output_root: report/publication/new_experiments/08_scientific_execution
