[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fvc-publication-experiments"
version = "0.1.0"
description = "Frozen, standalone preparation and execution infrastructure for the FVC publication extensions"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "PyYAML>=6.0",
  "rasterio>=1.4",
  "shapely>=2.0",
  "pyproj>=3.6",
  "geopandas>=1.0",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "matplotlib>=3.9",
  "requests>=2.32",
  "earthengine-api>=1.7",
  "httpx>=0.28",
  "boto3>=1.40",
  "python-dotenv>=1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "Additional Sensitivity Analysis/tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
